# Prometheus Alert Rules — Wallet Platform
groups:
  - name: wallet_platform_alerts
    rules:
      # High error rate: more than 5% of requests are 4xx/5xx over 5 minutes
      - alert: HighErrorRate
        expr: rate(http_errors_total[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes."

      # Backend down: no successful scrapes for 1 minute
      - alert: BackendDown
        expr: up{job="wallet-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Wallet backend is down"
          description: "Backend has been unreachable for more than 1 minute."

      # High response latency: P95 > 2 seconds
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="wallet-backend"}[5m])) > 2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "High P95 response latency"
          description: "P95 latency is {{ $value }}s over the last 5 minutes."
